name: Auto Build

on:
  workflow_dispatch:
    # inputs:
    #   tags:
    #     description: 'Docker Tag'
    #     required: false
    #     default: 'latest'
  push:
    branches: [main,master]
    # Only build when files in these directories have been changed
    paths:
      - containers/**
      - template/**
  schedule:
    - cron:  '0 9 * * 1' # UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Login to Dockerhub
      if: env.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Images
      run: ./bin/01-update-images ${{ secrets.GITHUB_TOKEN }}

    - name: Update Readme
      run: ./bin/02-update-readme

    - uses: EndBug/add-and-commit@v11
      with:
        author_name: "github-actions[bot]"
        author_email: "41898282+github-actions[bot]@users.noreply.github.com"
        message: 'CI: Autobuild Repo'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Images to ghcr.io
      run: ./bin/03-build-images push
      env:
        CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    - name: Build and Push Images to docker hub
      if: env.DOCKERHUB_USERNAME != ''
      run: ./bin/03-build-images push
      env:
        CI_REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/terraria
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    - name: Docker Hub Description
      if: env.DOCKER_HUB_USER != ''
      uses: peter-evans/dockerhub-description@v5
      env:
        DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASS }}
        repository: ${{ secrets.DOCKER_HUB_USER }}/terraria
        short-description: "Docker images to run a Terraria Server. Images with TShock Server or Vanilla Server are available."
